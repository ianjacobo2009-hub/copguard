[project]
name = "copguard"
version = "1.0.0"
description = "COP/USD exchange-rate risk intelligence: GARCH, Monte Carlo VaR, hedging and stress tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ian · Blue Peak AI & Finance Solutions" }]
dependencies = ["PySide6>=6.6", "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
copguard = "copguard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["copguard"]
